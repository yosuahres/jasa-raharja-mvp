name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Nothing gets pushed to the registry until the checks are green. Watchtower on
  # the VPS pulls whatever :prod points at, so a broken image published here is a
  # broken production a minute later.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: extractor/requirements.txt

      # Tests against the sample tariff books skip: the PDFs aren't in the repository.
      - name: Extractor tests
        working-directory: extractor
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Dashboard lint
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm lint

  extractor:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: extractor
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jasa-raharja-extractor:prod
          cache-from: type=gha,scope=extractor
          cache-to: type=gha,mode=max,scope=extractor

  dashboard:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jasa-raharja-dashboard:prod
          # Public values only (the publishable key is enforced by row-level security).
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
